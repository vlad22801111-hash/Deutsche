 $("app").innerHTML=head()+`<h2>PvP с ботом</h2><div class="banner"><b>Соперник — бот</b>Оба открывают один кейс. У кого подарок дороже, тот забирает оба. Звёзды виртуальные.</div><div id="pv"></div><div class="res" id="pm"></div><div class="grid">`+C.map(c=>`<button class="card" data-c="${c.id}"><h3>${c.n}</h3><div class="art">${chestHTML(c)}</div><div class="pr">⭐ ${c.p}</div></button>`).join("")+`</div>`;
 document.querySelectorAll(".card").forEach(b=>b.onclick=()=>duel(byId(+b.dataset.c)));
}
function duel(c){
 if(busy)return;if(bal<c.p){$("pm").textContent="Не хватает звёзд — получи их по промокоду.";return}
 busy=true;bal-=c.p;$("pm").textContent="";document.querySelector(".bal").firstChild.textContent="⭐ "+bal.toLocaleString("ru");
 const a=roll(c),b=roll(c);
 $("pv").innerHTML=`<div class="duel"><div>Ты<div class="q">❓</div></div><div>Бот<div class="q">❓</div></div></div>`;
 setTimeout(()=>{
  const win=a[2]>b[2],tie=a[2]===b[2];
  $("pv").innerHTML=`<div class="duel"><div class="${win?"w":""}">Ты<div class="rv">${a[0]}</div>${a[1]}<br>⭐ ${a[2]}</div><div class="${!win&&!tie?"w":""}">Бот<div class="rv">${b[0]}</div>${b[1]}<br>⭐ ${b[2]}</div></div>`;
  if(win){inv.unshift(a,b);earned+=a[2]+b[2];opened++;best=Math.max(best,a[2],b[2]);$("pm").textContent=`Победа! Оба подарка твои (⭐ ${a[2]+b[2]})`;rain();try{vib&&navigator.vibrate&&navigator.vibrate([60,40,60])}catch(e){}}
  else if(tie){bal+=c.p;$("pm").textContent="Ничья — ставка возвращена"}
  else $("pm").textContent="Бот выиграл. Попробуй ещё раз!";
  document.querySelector(".bal").firstChild.textContent="⭐ "+bal.toLocaleString("ru");save();busy=false;
 },1500);
}
function profOld(){
 $("app").innerHTML=head()+`<h2>Мои подарки</h2><div class="list">`+(inv.length?inv.map((x,i)=>`<div class="row"><div class="e">${x[0]}</div><div><b>${x[1]}</b></div><button class="s" data-i="${i}">Продать ⭐ ${x[2]}</button></div>`).join(""):'<div class="empty">Пока пусто — открой первый кейс.</div>')+`</div>`+(inv.length?`<button class="go" id="all" style="background:var(--pink);color:#2a0016">Продать всё за ⭐ ${inv.reduce((a,x)=>a+x[2],0)}</button>`:"");
 document.querySelectorAll(".s").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;bal+=inv[i][2];inv.splice(i,1);draw()});
 if($("all"))$("all").onclick=()=>{bal+=inv.reduce((a,x)=>a+x[2],0);inv=[];draw()};
}
let fpsT=0;
function fpsOn(){let e=document.getElementById("fps");if(!showFps){if(e)e.remove();return}
 if(!e){e=document.createElement("div");e.id="fps";e.style.cssText="position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:20;background:#000a;color:#7bff9a;font:700 12px monospace;padding:4px 8px;border-radius:8px";document.body.appendChild(e)}
 if(fpsT)return;fpsT=1;let f=0,t=performance.now();const lp=n=>{if(!showFps){fpsT=0;return}f++;if(n-t>=1000){const x=document.getElementById("fps");if(x)x.textContent=Math.round(f*1000/(n-t))+" FPS";f=0;t=n}requestAnimationFrame(lp)};requestAnimationFrame(lp)}
function draw(){
 fpsOn();document.documentElement.className=theme||"";
 if(view==="admin"&&!admin)view="home";
 save();
 if(view==="home")home();else if(view==="case")caseV();else if(view==="promo")promoV();else if(view==="pvp")pvpV();else if(view==="admin")adminV();else if(view==="search")searchV();else if(view==="settings")settingsV();else if(view==="up")upV();else if(view==="vip")vipV();else if(view==="top")topV();else if(view==="shop")shopV();else if(view==="crash")crashV();else if(view==="tasks")tasksV();else if(view==="games")gamesV();else prof();
 const a=$("add");if(a)a.onclick=()=>{if(busy)return;view="promo";draw()};
 $("na").hidden=!admin;[["nh",view==="home"||view==="case"],["nv",view==="pvp"],["np",view==="promo"],["na",view==="admin"],["ns",view==="search"],["nu",view==="up"],["nvp",view==="vip"],["nt",view==="top"],["nsh",view==="shop"],["ncr",view==="crash"],["ntk",view==="tasks"],["ngm",view==="games"],["ni",view==="inv"]].forEach(([i,on])=>$(i).setAttribute("aria-current",on?"page":"false"));
}
$("nh").onclick=()=>{if(busy)return;view="home";draw()};
$("nv").onclick=()=>{if(busy)return;view="pvp";draw()};
$("na").onclick=()=>{if(busy)return;view="admin";draw()};
$("nvp").onclick=()=>{if(busy)return;view="vip";draw()};
$("nsh").onclick=()=>{if(busy)return;view="shop";draw()};
$("ngm").onclick=()=>{if(busy)return;view="games";draw()};
$("ntk").onclick=()=>{if(busy)return;view="tasks";draw()};
$("ncr").onclick=()=>{if(busy)return;view="crash";draw()};
$("nt").onclick=()=>{if(busy)return;view="top";draw()};
$("nu").onclick=()=>{if(busy)return;view="up";draw()};
$("ns").onclick=()=>{if(busy)return;view="search";draw()};
$("np").onclick=()=>{if(busy)return;view="promo";draw()};
$("ni").onclick=()=>{if(busy)return;view="inv";draw()};
draw();
if(!theme&&Date.now()<UPD){halAt=Date.now()+30000;setTimeout(function(){if(!theme&&Date.now()<UPD)runHalUpdate()},30000)}
setInterval(function(){var e=document.getElementById("cdb");if(e)e.innerHTML=cdText();var e3=document.getElementById("bdg");if(e3)e3.innerHTML=badgeHTML();var e2=document.getElementById("pct");if(e2){var l2=halT+6e4-Date.now();e2.textContent=halT?(l2>0?"🔥 Промокод 557: осталось 0:"+pad2(Math.ceil(l2/1000)):"Промокод 557 больше не действует"):"";if(sumT){var l3=sumT+12e4-Date.now();e2.textContent=l3>0?"☀️ Промокод 12345: осталось "+Math.floor(l3/6e4)+":"+pad2(Math.ceil(l3/1000)%60):"Промокод 12345 больше не действует"}}var sl=Math.floor(Date.now()/1.8e6);if(sl!==lastSlot){lastSlot=sl;if(view==="home"&&!q&&!busy)draw()}if(Date.now()>=UPD&&!updSeen&&!busy)location.reload()},1000);
if(Date.now()>=UPD&&!updSeen)setTimeout(showUpd,400);
</script>
</body>
